org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Plugins (ex.: file_picker) compilam Kotlin no JVM target do JDK em uso (21)
# enquanto o Java fica em 17 → o AGP falha com "Inconsistent JVM-target".
# Como não dá pra editar o build dos plugins, ignoramos essa validação (o D8
# dexa normalmente; o app roda). É a propriedade oficial do Kotlin Gradle p/ isso.
kotlin.jvm.target.validation.mode=ignore
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
