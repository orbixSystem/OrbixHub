name: CI
on:
  push: { branches: [main, qa] }
  pull_request:

# Um run por ref: push novo cancela o anterior em vez de empilhar.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  back:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: app_owner, POSTGRES_PASSWORD: owner_pw, POSTGRES_DB: orbixhub }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app_owner -d orbixhub"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Um BOM (EF BB BF) no topo de um .sql derruba o deploy: o Postgres
      # responde `syntax error at or near "\ufeff"` e o prisma migrate deploy
      # marca a migration como falha, travando TODAS as seguintes ate alguem
      # rodar `migrate resolve` na producao. Ja aconteceu com a
      # 0046_retire_legacy_sales_module. Editor no Windows reintroduz isso
      # sozinho, entao o CI barra antes de virar problema de producao.
      - name: SQL sem BOM
        run: |
          # `od -An -tx1` separa os bytes com 1 espaco no GNU e 2 no BSD, entao
          # o espaco e removido antes de comparar — o teste vale nos dois.
          # `if/fi` em vez de `[ ... ] && echo`: o `&&` deixava o loop terminar
          # com status 1 sempre que o ULTIMO .sql varrido nao tinha BOM (o caso
          # normal). Como o runner roda `bash -e`, a atribuicao `bom=$(...)`
          # herdava esse 1 e matava o passo ANTES do teste abaixo — o guard
          # reprovava todo PR e nunca chegava a imprimir o ::error::.
          bom=$(find . -name '*.sql' -not -path './node_modules/*' -print0 \
            | while IFS= read -r -d '' f; do
                if [ "$(head -c3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
                  echo "$f"
                fi
              done)
          if [ -n "$bom" ]; then
            echo "::error::arquivo .sql com BOM (quebra o psql/prisma):"
            echo "$bom"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint --workspace back
      - run: npm run prisma:generate --workspace back
      # NOTE: scripts/ci-db-setup.ts is created in Phase 2 Task 2.3; this step
      # (and the e2e suite below) pass once Phase 2 lands.
      - name: Apply baseline + roles
        working-directory: back
        run: npx ts-node scripts/ci-db-setup.ts
        env:
          ADMIN_DATABASE_URL: postgresql://app_owner:owner_pw@localhost:5432/orbixhub
      - run: npm run test --workspace back
        env: { NODE_ENV: test }
      - run: npm run test:e2e --workspace back
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://app_user:app_user_pw@localhost:5432/orbixhub
          MIGRATION_DATABASE_URL: postgresql://app_migrator:app_migrator_pw@localhost:5432/orbixhub
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci_secret_at_least_32_bytes_long_xxxxx
          CORS_ORIGINS: http://localhost:3000
