name: Deploy prod

# Push na main => builda no GitHub (nunca na EC2) e faz deploy sozinho.
# Tambem pode ser disparado na mao (workflow_dispatch).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      resolve_failed_migration:
        description: >-
          Destrava o P3009. Nome da migration que ficou marcada como FALHA no
          banco (ex.: 0046_retire_legacy_sales_module). Ela e marcada como
          revertida ANTES do migrate deploy, que entao a reaplica. Use so
          quando a migration NAO chegou a alterar o banco — se ela aplicou
          parte das mudancas, reaplicar pode duplicar efeito. Erro de sintaxe
          na posicao 0 e o caso seguro: nada foi executado. Em branco = deploy
          normal, nada e resolvido.
        required: false
        default: ''

# Nunca deixa dois deploys correrem ao mesmo tempo.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/backend
  FLUTTER_VERSION: 3.44.1

jobs:
  # 1) Portao de qualidade: lint + testes unitarios do backend.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm run lint --workspace back
      - run: npm run prisma:generate --workspace back
      - run: npm run test --workspace back
        env: { NODE_ENV: test }

  # 2) Builda a imagem do backend e publica no GHCR.
  build-backend:
    needs: test
    # Runner ARM nativo: a EC2 de producao e t4g (Graviton/arm64). Buildar em
    # x86 sem isso gera imagem amd64 e o podman falha com "exec format error".
    # Repo publico => runners ARM sao gratuitos; nada de QEMU (que compilaria
    # o argon2 nativo sob emulacao, lentissimo).
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup buildx (driver que suporta cache gha)
        uses: docker/setup-buildx-action@v3
      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Ref da imagem (lowercase + sha)
        id: meta
        run: |
          IMG=$(echo "${IMAGE}" | tr '[:upper:]' '[:lower:]')
          echo "image_ref=${IMG}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${IMG}:latest" >> "$GITHUB_OUTPUT"
      - name: Build + push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: back/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ steps.meta.outputs.image_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Builda o Flutter web (artefato pro nginx).
  build-front:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Versao real no build: sem isto o version.json publicado dizia
      # "1.0.0+1" para sempre, e nao havia como saber, olhando o ar, QUAL
      # commit estava servindo — a duvida "nao deployou ou e cache do
      # navegador?" so se resolvia baixando os 6 MB do main.dart.js e
      # procurando string dentro. O run_number e monotonico e leva de
      # volta ao run do Actions; o deploy-info.json carrega o SHA exato.
      - name: Versao do build
        id: v
        run: |
          set -euo pipefail
          BASE=$(grep -E '^version:' front/pubspec.yaml | awk '{print $2}' | cut -d+ -f1)
          echo "name=$BASE" >> "$GITHUB_OUTPUT"
      - working-directory: front
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs
          flutter build web --release \
            --build-name=${{ steps.v.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL=https://hub.orbixsystem.com/api \
            --dart-define=APP_PUBLIC_URL=https://hub.orbixsystem.com
      # Carimbo do que esta no ar, consultavel sem abrir o app:
      #   curl -s https://hub.orbixsystem.com/deploy-info.json
      - name: Carimba o commit no artefato
        working-directory: front/build/web
        run: |
          set -euo pipefail
          printf '{"commit":"%s","ref":"%s","run":"%s","builtAt":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_NUMBER" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > deploy-info.json
          cat deploy-info.json
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: front/build/web
          retention-days: 3

  # 4) Deploy na EC2 via Tailscale (sem porta aberta pro mundo).
  deploy:
    needs: [build-backend, build-front]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Conecta na Tailnet
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          # ephemeral: o node do CI some depois; sem sujeira na tailnet.

      - name: Baixa o Flutter web
        uses: actions/download-artifact@v4
        with:
          name: web
          path: web

      - name: Prepara chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}          # IP tailscale ou MagicDNS da EC2
          USER: ${{ secrets.DEPLOY_USER }}          # ubuntu
          IMAGE_REF: ${{ needs.build-backend.outputs.image_ref }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESOLVE_MIGRATION: ${{ github.event.inputs.resolve_failed_migration }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20 ${USER}@${HOST}"

          echo "== login no GHCR (na EC2) =="
          echo "${GHCR_TOKEN}" | $SSH "podman login ghcr.io -u ${GHCR_USER} --password-stdin"

          echo "== envia o Flutter web =="
          rsync -az -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new" \
            --delete web/ "${USER}@${HOST}:/tmp/orbix-web/"
          $SSH "sudo rsync -a --delete /tmp/orbix-web/ /var/www/orbixhub/ && rm -rf /tmp/orbix-web"

          echo "== envia o script de deploy e executa (backend) =="
          scp -i ~/.ssh/id_deploy -o StrictHostKeyChecking=accept-new \
            scripts/deploy/remote-deploy.sh "${USER}@${HOST}:/tmp/remote-deploy.sh"
          $SSH "chmod +x /tmp/remote-deploy.sh && /tmp/remote-deploy.sh '${IMAGE_REF}' '${RESOLVE_MIGRATION:-}'"

          echo "== confere pela borda publica =="
          curl -fsS https://hub.orbixsystem.com/api/health | grep -q '"status":"ok"'
          echo "deploy OK"
